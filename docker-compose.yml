services:
  mysql:
    image: mysql:8.0
    container_name: ig-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: intelligent_grading
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_BIND_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ig-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    ports:
      - "127.0.0.1:${REDIS_BIND_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  springboot:
    build:
      context: .
      dockerfile: Dockerfile.springboot
    container_name: ig-springboot
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/intelligent_grading?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
      # 部署必须显式设置强密钥，禁止回落到公开默认值
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (e.g. openssl rand -hex 32)}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  judge-engine:
    build:
      context: ./judge-engine
      dockerfile: Dockerfile
    container_name: ig-judge-engine
    ports:
      - "3000:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DB: intelligent_grading
      # 判题工作根目录：必须指向宿主可见路径（compose 将其映射到 ./judge-work）
      JUDGE_WORK_ROOT: /host-work
    # 即使以 root 运行，也丢弃所有 capability 并禁止提权，缩小被攻破后的影响面
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # 判题临时工作目录：容器内 /host-work 与宿主 ./judge-work 双向映射，
      # 使 Docker daemon 解析的 bind 源路径与 judge-engine 容器内路径一致
      - ./judge-work:/host-work
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  vue-frontend:
    build:
      context: ./vue-frontend
      dockerfile: Dockerfile
    container_name: ig-vue-frontend
    ports:
      - "80:80"
    depends_on:
      - springboot
      - judge-engine

volumes:
  mysql-data:

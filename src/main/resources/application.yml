server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/intelligent_grading?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 默认不打印 SQL，避免生产暴露内部细节；本地开发可设 MYBATIS_LOG_IMPL=org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      id-type: auto

jwt:
  # 本地 mvn 开发用默认值；Docker 部署必须通过环境变量 JWT_SECRET 注入强密钥
  secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-in-production}
  expiration: 86400000  # 24 hours in ms

app:
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost}

# --- Judge Engine WebSocket ---
judge:
  ws-url: ws://localhost:3000

logging:
  level:
    # 默认 info，避免 debug 日志暴露内部细节；本地开发可设 LOG_LEVEL=debug
    com.intelligentgrading: ${LOG_LEVEL:info}
